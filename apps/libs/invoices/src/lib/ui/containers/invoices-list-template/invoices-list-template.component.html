@if(invoices().length > 0) {
<p-virtualscroller
  [items]="invoices()"
  [itemSize]="50"
  [showLoader]="pending()"
  [delay]="150"
  [loading]="pending()"
  [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  styleClass="border border-surface"
  [style]="{ width: '100%', height: '300px' }"
>
  <ng-template #item let-item let-options="options">
    <div class="flex items-center p-2 w-full" style="height: 50px">
      {{ item?.clientName || '' }} (ID: {{ item?.id || '' }})
    </div>
  </ng-template>
</p-virtualscroller>
}
