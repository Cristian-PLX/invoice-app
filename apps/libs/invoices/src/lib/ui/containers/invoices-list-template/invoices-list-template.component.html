@if(invoices().length > 0) {
<p-virtualscroller
  [items]="invoices()"
  [itemSize]="107"
  [showLoader]="pending()"
  [delay]="150"
  [loading]="pending()"
  [lazy]="true"
  (onLazyLoad)="onLazyLoad($event)"
  class="w-full h-full"
>
  <ng-template #item let-item let-options="options">
    @if(item){
    <div
      class="grid grid-cols-[repeat(2,_98px)_auto_minmax(50px,1fr)_90px] items-center gap-x-11 bg-white dark:bg-gray-800 rounded-lg p-6 ml-5 mr-5 mb-4 ring shadow-xl ring-gray-900/5"
    >
      <p class="font-bold text-[15px] leading-none">#{{ item?.id || '' }}</p>
      <p
        class="text-[13px] leading-none text-left font-medium text-[#858BB2] dark:text-white"
      >
        {{ item?.createdAt }}
      </p>
      <p class="text-[#858BB2] font-medium text-[13px] dark:text-white">
        {{ item?.clientName }}
      </p>
      <p class="text-right font-bold">{{ item?.total }}€</p>
      @if(item?.status === INVOICE_STATUS.PAID){
      <p-tag
        class="text-[15px] capitalize"
        icon="pi pi-circle-on"
        severity="success"
        [value]="INVOICE_STATUS.PAID"
      />

      } @else if(item?.status === INVOICE_STATUS.PENDING) {
      <p-tag
        class="text-[15px] capitalize"
        icon="pi pi-circle-on"
        severity="warn"
        [value]="INVOICE_STATUS.PENDING"
      />
      }
    </div>
    }
  </ng-template>
</p-virtualscroller>
}
